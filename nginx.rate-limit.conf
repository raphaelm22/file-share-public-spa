# http context (included via conf.d/) — cannot live inside server block

server_tokens off;

# Real client IP: the container is only reachable through the Docker network
# (cloudflared / reverse proxy), so trust forwarded headers from private ranges.
# Without this, every visitor shares the proxy's IP and one abuser rate-limits everyone.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=dl_limit:10m rate=10r/m;
limit_req_status 429;

# /dl/{token} serves two clients: browsers navigating (want the SPA HTML) and the SPA's fetch (wants JSON)
map $http_accept $dl_wants_html {
    default     0;
    ~*text/html 1;
}
