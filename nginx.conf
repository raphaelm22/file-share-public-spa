server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here accepts a body
    client_max_body_size 1k;

    # Docker internal DNS — required for proxy_pass with variable
    resolver 127.0.0.11 valid=30s;

    # Variable enables lazy DNS resolution (nginx starts even if backend is down)
    set $backend "backend:8080";

    include /etc/nginx/snippets/security-headers.conf;

    # ─── Download file: GET /dl/{token}/file ───────────────────────────────
    # Token format enforced here too (64 lowercase hex) — junk never reaches the backend
    location ~ "^/dl/[0-9a-f]{64}/file$" {
        limit_except GET { deny all; }
        limit_req zone=dl_limit burst=5 nodelay;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Backend refuses /api and /hubs for any request carrying this header
        proxy_set_header X-FileShare-Public "1";
        proxy_hide_header X-Powered-By;
    }

    # ─── Share metadata for the SPA: GET /dl/{token}/info ──────────────────
    # Distinct URL from the HTML page, so a browser can never answer it with the cached page
    location ~ "^/dl/[0-9a-f]{64}/info$" {
        limit_except GET { deny all; }
        limit_req zone=dl_limit burst=5 nodelay;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-FileShare-Public "1";
        proxy_hide_header X-Powered-By;
    }

    # ─── GET /dl/{token}: HTML page for browsers, JSON for API clients ─────
    location ~ "^/dl/[0-9a-f]{64}$" {
        if ($dl_wants_html) { rewrite ^ /index.html last; }

        limit_except GET { deny all; }
        limit_req zone=dl_limit burst=5 nodelay;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;

        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-FileShare-Public "1";
        proxy_hide_header X-Powered-By;
    }

    # ─── Malformed /dl/* URLs: page for browsers, 404 problem for the SPA fetch
    location /dl/ {   # plain prefix: the token regex locations above still win
        if ($dl_wants_html) { rewrite ^ /index.html last; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Share not found","detail":"TOKEN_NOT_FOUND"}';
    }

    # ─── Block admin API and hub routes ────────────────────────────────────
    location /api/ { return 404; }
    location /hubs/ { return 404; }

    # ─── robots.txt: keep the whole site out of search engines ─────────────
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ─── SPA fallback (also serves the /dl/{token} HTML page for browsers) ─
    location / {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # index.html is tiny and references hashed assets: never cache it, and mark that
        # the same URL (/dl/{token}) may return JSON for other Accept values
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache hashed static assets ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
}
